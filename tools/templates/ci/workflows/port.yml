{{port_comment}}
name: {{wf_prefix}}port
on:
  push:{{on_paths}}{{port_push_branches}}
  pull_request:{{on_paths}}
permissions:
  contents: read
concurrency:
  group: {{wf_prefix}}port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang ninja-build pkg-config >/dev/null
      - name: Cache SDL3 and libmt32emu
        uses: actions/cache@v4
        with:
          path: {{libs_dir}}
          key: libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('{{libs_script}}') }}
      - name: Build SDL3 and libmt32emu (when not cached), fetch Nuked OPL3
        run: |
          {{setup_libs}}
          echo "PKG_CONFIG_PATH=$PWD/{{libs_dir}}/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH=$PWD/{{libs_dir}}/lib/pkgconfig {{setup_sound}}
      - run: {{port}}
      - run: {{port_check}}

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      - name: Homebrew packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sdl3 mt32emu pkgconf
      - run: {{setup_sound}}
      - run: {{port}}
      - run: {{port_check}}

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the scripts must keep their LF line ends for MSYS2's sh
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      # MSYS2's CLANG64 environment: clang targeting the Universal C Runtime, SDL3 and
      # pkg-config from its packages; no libmt32emu, so the Windows build has no MT-32
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make curl
          pacboy: clang:p llvm:p pkgconf:p sdl3:p python:p
      - run: {{setup_sound}}
      - run: {{port_windows}}
      - run: {{port_check_windows}}
