{{port_comment}}
name: {{wf_prefix}}port
on:
  push:{{on_paths}}{{port_push_branches}}
  pull_request:{{on_paths}}
permissions:
  contents: read
concurrency:
  group: {{wf_prefix}}port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang ninja-build pkg-config >/dev/null
      - name: Cache SDL3 and libmt32emu
        uses: actions/cache@v6
        with:
          path: {{libs_dir}}
          key: libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('{{libs_script}}') }}
      - name: Build SDL3 and libmt32emu (when not cached), fetch Nuked OPL3
        run: |
          {{setup_libs}}
          echo "PKG_CONFIG_PATH=$PWD/{{libs_dir}}/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH=$PWD/{{libs_dir}}/lib/pkgconfig {{setup_sound}}
      - run: {{port}}
      - run: {{port_check}}

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      # Emscripten, pinned to the version the web build is made with (docs/WEB.md), in ~/emsdk
      # where the Makefile's web target sources it
      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('{{web_emsdk_script}}') }}-{{web_emsdk_version}}
      - name: Install Emscripten
        run: EMSDK_VERSION={{web_emsdk_version}} sh {{web_emsdk_script}}
      - name: Cache the web libraries
        uses: actions/cache@v6
        with:
          path: {{web_libs_dir}}
          key: libs-web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('{{web_libs_script}}', '{{web_emsdk_script}}') }}-{{web_emsdk_version}}
      - name: Build SDL3 and libmt32emu for WebAssembly (when not cached)
        run: |
          # shellcheck source=/dev/null
          . ~/emsdk/emsdk_env.sh >/dev/null 2>&1
          SETUP_WEB=1 sh {{web_libs_script}} {{web_libs_dir}}
      - name: Fetch Nuked OPL3 (the web build has the FM music as the desktop one does)
        run: {{setup_sound}}
      - run: {{web_make}}

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      - name: Homebrew packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sdl3 mt32emu pkgconf
      - run: {{setup_sound}}
      - run: {{port}}
      - run: {{port_check}}

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the scripts must keep their LF line ends for MSYS2's sh
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      # MSYS2's CLANG64 environment: clang targeting the Universal C Runtime, SDL3 and
      # pkg-config from its packages; no libmt32emu, so the Windows build has no MT-32
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make curl
          pacboy: clang:p llvm:p pkgconf:p sdl3:p python:p
      - run: {{setup_sound}}
      - run: {{port_windows}}
      - run: {{port_check_windows}}
