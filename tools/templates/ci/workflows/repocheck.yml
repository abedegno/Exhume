{{repocheck_comment}}
name: {{wf_prefix}}repocheck
on:
  push:
  pull_request:
permissions:
  contents: read
{{repocheck_env}}
jobs:
  repocheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
{{repocheck_exhume_checkout}}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: {{repocheck}}
