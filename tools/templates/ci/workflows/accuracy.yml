{{accuracy_comment}}
name: {{wf_prefix}}accuracy
on:
  push:{{on_paths}}
    branches: [main]
  pull_request:{{on_paths}}
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: {{wf_prefix}}accuracy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  make-test:
    if: {{job_if}}
    runs-on: ubuntu-24.04
    # make test with every enhancement's checks (each presentation enhancement replays every
    # session): about 50 minutes on the hosted runners for UW1
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      - uses: ./.github/actions/{{linux_tools_action}}
      - uses: ./.github/actions/{{assets_action}}
        with:
          deploy-key: ${{ secrets.{{deploy_secret}} }}
          age-key: ${{ secrets.{{age_secret}} }}
      - name: {{setup_name}}
        run: {{setup}}
      - name: {{test}}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          {{test}} 2>&1 | tee "$RUNNER_TEMP/logs/make-test.log"
      # Only pictures and text logs: the difference pictures of a session that differs from its
      # golden, the port's own log of each replay, and this run's output. Never the state dumps,
      # the saved games, objects, EXEs or anything else under build/.
{{mt32_step}}
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: make-test-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            {{verify_dir}}/**/diff_ck*.png
            {{verify_dir}}/**/port.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        run: rm -rf "$RUNNER_TEMP/{{tmp_assets}}" "$RUNNER_TEMP/{{tmp_clone}}" "$RUNNER_TEMP/{{tmp_key}}" {{cleanup}}

  # The port only: no DOS and no Borland toolchain (replay.py verify needs neither; without
  # Turbo C++ it does not check the goldens against the replay DOS build).
  verify-windows:
    if: {{job_if}}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the recordings and scripts must keep their bytes and LF line ends (also .gitattributes)
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make curl git
          pacboy: clang:p llvm:p pkgconf:p sdl3:p python:p cmake:p ninja:p
      # age's own Windows build at a pinned version, checked against its SHA-256, for the
      # {{assets_action}} action (which runs in Git Bash)
      - name: age
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'age.zip'
          Invoke-WebRequest -Uri 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip' -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne 'f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7') { throw "age: unexpected SHA-256 $sum" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'age-bin')
          Join-Path $env:RUNNER_TEMP 'age-bin\age' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: ./.github/actions/{{assets_action}}
        with:
          deploy-key: ${{ secrets.{{deploy_secret}} }}
          age-key: ${{ secrets.{{age_secret}} }}
      - name: Cache libmt32emu
        uses: actions/cache@v6
        with:
          path: {{libs_dir}}
          key: libs-windows-clang64-${{ hashFiles('{{libs_script}}') }}
      - name: Build libmt32emu (when not cached), fetch Nuked OPL3
        run: |
          {{setup_libs_windows}}
          {{setup_sound}}
      - run: {{port_windows}}
      - name: The sessions against the goldens
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          {{verify_windows}} 2>&1 | tee "$RUNNER_TEMP/logs/verify-windows.log"
{{mt32_step}}
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            {{verify_dir}}/**/diff_ck*.png
            {{verify_dir}}/**/port.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/{{tmp_assets}}" "$RUNNER_TEMP/{{tmp_clone}}" "$RUNNER_TEMP/{{tmp_key}}" {{verify_cleanup}}

  package-windows:
    if: {{job_if}}
    # Windows Server 2022, the hosted Windows nearest Windows 10: the players' zip, unpacked and
    # started with only Windows's folders on the PATH (a DLL missing from the zip stops it), then
    # the sessions replayed by that program against the goldens (Exhume's tools/pkgcheck.py)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the recordings and scripts must keep their bytes and LF line ends (also .gitattributes)
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make curl git
          pacboy: clang:p llvm:p pkgconf:p sdl3:p python:p cmake:p ninja:p
      # age's own Windows build at a pinned version, checked against its SHA-256, for the
      # {{assets_action}} action (which runs in Git Bash)
      - name: age
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'age.zip'
          Invoke-WebRequest -Uri 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip' -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne 'f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7') { throw "age: unexpected SHA-256 $sum" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'age-bin')
          Join-Path $env:RUNNER_TEMP 'age-bin\age' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: ./.github/actions/{{assets_action}}
        with:
          deploy-key: ${{ secrets.{{deploy_secret}} }}
          age-key: ${{ secrets.{{age_secret}} }}
      - name: Cache libmt32emu
        uses: actions/cache@v6
        with:
          path: {{libs_dir}}
          key: libs-windows-clang64-${{ hashFiles('{{libs_script}}') }}
      - name: Build libmt32emu (when not cached), fetch Nuked OPL3
        run: |
          {{setup_libs_windows}}
          {{setup_sound}}
      - name: The players' package, unpacked, started and replayed
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          ({{package_check_windows}}) 2>&1 | tee "$RUNNER_TEMP/logs/package-windows.log"
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            {{verify_dir}}/**/diff_ck*.png
            {{verify_dir}}/**/port.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/{{tmp_assets}}" "$RUNNER_TEMP/{{tmp_clone}}" "$RUNNER_TEMP/{{tmp_key}}" {{verify_cleanup}}

  verify-macos:
    if: {{job_if}}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
{{checkout_submodules}}
{{exhume_checkout}}
      - name: Homebrew packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sdl3 mt32emu pkgconf age
      - uses: ./.github/actions/{{assets_action}}
        with:
          deploy-key: ${{ secrets.{{deploy_secret}} }}
          age-key: ${{ secrets.{{age_secret}} }}
      - run: {{setup_sound}}
      - run: {{port}}
      - name: The sessions against the goldens
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          {{verify}} 2>&1 | tee "$RUNNER_TEMP/logs/verify-macos.log"
{{mt32_step}}
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-macos-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            {{verify_dir}}/**/diff_ck*.png
            {{verify_dir}}/**/port.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        run: rm -rf "$RUNNER_TEMP/{{tmp_assets}}" "$RUNNER_TEMP/{{tmp_clone}}" "$RUNNER_TEMP/{{tmp_key}}" {{verify_cleanup}}
