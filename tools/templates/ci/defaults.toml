# tools/citemplates.py's defaults: a decompilation project that keeps Exhume as a checkout in
# .exhume (pinned by EXHUME_REF), uses tools/templates/Makefile, and has its port configured in
# exhume.toml ([port], [replay], [fuzz]). Its private bundle (docs/ci-bundle.md) holds game/
# (the user's own copy of the program), tc/ and tasm/ (the Borland disk images). A project
# overrides any of these in the file [ci] vars names; examples/uw2/ci.toml is UW2Decomp's.

# the commands
test = "make EXHUME=.exhume test"
test_full = "make EXHUME=.exhume test-full"
test_full_summary = "==== test full:"
setup_name = "Unpack Turbo C++ and TASM from the bundle's disk images"
setup = "sh .exhume/profiles/borland-tc101/setup-tc.sh \"$TC_DISKS\" toolchain/TC && sh .exhume/profiles/borland-tc101/setup-tasm.sh \"$TASM_DISKS\" toolchain/TASM"
setup_libs = "sh .exhume/tools/setup-libs.sh tools/libs"
setup_sound = "sh .exhume/tools/setup-sound.sh tools/nuked-opl3"
port = "make EXHUME=.exhume port"
verify = "make EXHUME=.exhume verify"
verify_windows = "make EXHUME=.exhume PY=python verify"
setup_libs_windows = "SETUP_LIBS=mt32emu sh .exhume/tools/setup-libs.sh tools/libs"
port_check = "make EXHUME=.exhume port-check"
port_windows = "make EXHUME=.exhume PY=python port"
port_check_windows = "make EXHUME=.exhume PY=python port-check"
# package-windows: build and package the release build, check the zip starts as a player gets it
# (tools/pkgcheck.py, which prints the unpacked program), then replay the sessions with it
package_check_windows = 'make EXHUME=.exhume PY=python port-release && make EXHUME=.exhume PY=python package && exe=$(python .exhume/tools/pkgcheck.py "$(ls build/dist/*-windows-x86_64.zip)" --exe port --data "$GAME_DIR" --unpack "$RUNNER_TEMP/pkg") && EXHUME_PORT="$exe" make EXHUME=.exhume PY=python verify'
repocheck = "python3 .exhume/tools/repocheck.py --root . --allow '^\\.exhume/'"
nightly_cron = "17 3 * * *"
# the condition of accuracy.yml's jobs, and a line (with its indentation) that gives nightly.yml's
# job one, or nothing: a project whose private bundle is not set up yet can make both depend on a
# repository variable, so that they are skipped rather than failing
job_if = "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository"
nightly_if = ""

# release.yml: the players' packages on a tag (tools/package.py). With --config these four come
# from [package] and [port] (name, env, icon, launcher, exe); the values here are for --vars.
pkg_name = "GAME"
exe = "port"
icon = "game"
launcher = "game"
env = "GAME"
tmp_prefix = "port"
macos_archs_env = "SETUP_MACOS_ARCHS"
# release.yml's Linux job runs on Ubuntu 22.04, whose Python (3.10) has no tomllib, which
# Exhume's tools need: a step that sets up a newer one (empty for a project with tools of its own)
release_linux_python = '''
      # Exhume's tools need Python 3.11 or later (tomllib); Ubuntu 22.04 has 3.10
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"'''
port_release = "make EXHUME=.exhume port-release"
package = "make EXHUME=.exhume package"
port_release_windows = "make EXHUME=.exhume PY=python port-release"
package_windows = "make EXHUME=.exhume PY=python package"

# Exhume itself: checked out beside the project in every job that builds
exhume_checkout = '''
      - uses: actions/checkout@v7
        with:
          repository: abedegno/Exhume
          ref: ${{ vars.EXHUME_REF || 'master' }}
          path: .exhume
          persist-credentials: false'''
repocheck_env = ""
repocheck_exhume_checkout = '''
      - uses: actions/checkout@v7
        with:
          repository: abedegno/Exhume
          ref: ${{ vars.EXHUME_REF || 'master' }}
          path: .exhume'''

# where things are
requirements = ".exhume/tools/requirements.txt"
venv = ".exhume/.venv"
node_cache_path = "        cache-dependency-path: .exhume/package-lock.json"
npm_ci = "npm ci --no-audit --no-fund --prefix .exhume"
emu2_dir = ".exhume/tools/emu2"
emu2_script = ".exhume/tools/setup-emu2.sh"
emu2_patch = ".exhume/tools/emu2-date.patch"
libs_dir = "tools/libs"
libs_script = ".exhume/tools/setup-libs.sh"
libs_args = " tools/libs"
web_libs_dir = "tools/libs-web"
web_libs_script = ".exhume/tools/setup-libs.sh"
web_emsdk_script = ".exhume/tools/setup-emsdk.sh"
web_make = "make EXHUME=.exhume web"
nuked_dir = "tools/nuked-opl3"
sound_script = ".exhume/tools/setup-sound.sh"
sound_args = " tools/nuked-opl3"
verify_dir = "build/replay/verify"
golden_dir = "tests/replay/golden"
coverage_doc = "docs/COVERAGE.md"
coverage_data = "build/coverage/all.profdata"
cleanup = "toolchain build"
verify_cleanup = "build"

# the private bundle (docs/ci-bundle.md)
assets_action = "game-assets"
assets_title = "Game assets"
deploy_secret = "ASSETS_DEPLOY_KEY"
age_secret = "ASSETS_AGE_KEY"
age_env = "ASSETS_AGE_KEY"
bundle_repo = "OWNER/PROJECT-ci-assets"
bundle_file = "ci-assets.tar.gz.age"
tmp_assets = "game-assets"
tmp_clone = "ci-assets"
tmp_key = "assets-deploy-key"
tmp_hosts = "assets-known-hosts"
ci_assets = "sh .exhume/tools/ci-assets.sh"

# the header comments
accuracy_comment = '''
# The accuracy suite (Exhume's docs/port.md, "Verifying a port"; docs/ci-bundle.md): the gate
# (the exact link byte-identical to the original), the port build, the quick routine fuzzing and
# every replay session against its golden. It needs the program and the Borland toolchain,
# which come from the private bundle (the assets action), so it runs only where the
# repository's secrets are given: pushes to main, a manual run, and pull requests from branches
# of this repository. A pull request from a fork gets port.yml and repocheck.yml.'''
nightly_comment = '''
# The long tier, nightly (Exhume's tools/test.py full): the gate, both port builds, every golden
# made again from DOS in DOSBox-X (each session twice, checked identical), the sessions in the
# port and in the UBSan build, the sound drivers against the real ones, the deep routine fuzzing
# and the coverage report. It needs the private bundle, so it runs only on the schedule and by
# hand. The job fails when a regenerated golden differs from the committed one, and the coverage
# totals go to the job summary.'''
port_comment = '''
# The native port builds on Linux, macOS and Windows: the port's build and its compile-only
# measurement. Only the sources are needed: no game data, no toolchain and no secrets, so this
# runs on every push and every pull request, forks included. Nothing is run.'''
release_comment = '''
# Release packages of the native port (Exhume's docs/port.md, "Packages for players"): on a tag
# v*, build the port on macOS (one universal app for arm64 and x86_64), Linux (x86-64, on Ubuntu
# 22.04 for glibc 2.35: a tarball and an AppImage) and Windows (x86-64, MSYS2 CLANG64), package
# each with tools/package.py, and attach the packages and the source of the LGPL libraries to a
# DRAFT release, which the owner reviews and publishes by hand. Run by hand (workflow_dispatch),
# it builds the packages as workflow artifacts and makes no release.
# Only the sources are needed: no game data and no DOS toolchain. The only secrets are Apple's,
# for the macOS app: with CSC_LINK set it is signed with the Developer ID identity, and on a tag
# (or by hand with notarise) notarised and stapled; without them it is signed ad hoc.'''
repocheck_comment = '''
# Exhume's tools/repocheck.py (script syntax, Markdown links, no executables, objects,
# libraries, disk images or game data committed), which needs neither the toolchain nor the
# program, so it runs on every push and pull request, forks included. The gate runs in the
# pre-push hook and in accuracy.yml.'''
linux_tools_comment = '''
# The Linux tools for CI (docs/ci-bundle.md): system packages, Python with Exhume's
# requirements, Node with dos-mcp, and the tools built from source (emu2, SDL3 and libmt32emu,
# Nuked OPL3), each cached by the script that pins it. Nothing here touches the game or the
# toolchain, so every cached path is free of both.'''
assets_comment = '''
# Fetch and decrypt the CI asset bundle (docs/ci-bundle.md): the owner's own copy of the
# program and the Borland disk images, from a private repository with Actions disabled, cloned
# with its read-only deploy key and decrypted with the age key into $RUNNER_TEMP. Sets the
# variables tools/ci-assets.sh prints for the later steps. Nothing is listed or printed. The
# calling workflow must remove the decrypted tree and everything built from it in a final
# `if: always()` step, and must never cache or upload anything from them. Needs git, ssh, tar
# and age on the PATH: Linux and macOS runners (age from apt or Homebrew), and Windows, where
# bash is Git Bash and the job puts the official age build on the PATH first (accuracy.yml).'''

# A repository of several games ([[games]] in the values, tools/citemplates.py): each game's
# workflows are rendered with its own values, files and names prefixed by wf_prefix (uw1-);
# on_paths limits accuracy and port to the changes that concern it. A single-game project
# leaves all of these as they are.
wf_prefix = ""
on_paths = ""
checkout_submodules = ""
linux_tools_action = "linux-tools"
release_tags = '"v*"'
tag_prefix = "v"
dist_dir = "build/dist"
release_name = ""
# a step in the draft job before the release, for release_name (for example the version without
# the game's tag prefix, as steps.ver.outputs.v)
release_name_step = ""
# extra filters on port.yml's push trigger (for example branches: ['**'], so that a tag push, a
# release, does not build the port again)
port_push_branches = ""
# a step in accuracy's make-test, verify-windows and verify-macos jobs after the sessions, with the
# bundle's ROMs (MT32_ROMS): how the port finds MT-32 ROMs (tools/romcheck.py) and a session's
# MT-32 audio against its digest (tools/audiocheck.py); empty: none
mt32_step = ""
# release.yml: jobs that test the packages the workflow built before the draft is made (a repository's
# own, from its values), the jobs the draft waits for, and a schedule (the packages built and tested
# with no draft, between releases); by default none, the three packaging jobs, and no schedule
release_test_jobs = ""
draft_needs = "[macos, linux, windows]"
release_schedule = ""
# a step in the nightly before make test-full (for example dos-mcp's headless Chrome, for a session
# whose goldens only js-dos can make); empty: none
nightly_extra_step = ""
# more jobs in the nightly (for example the project tested against Exhume's latest master instead of
# its pinned submodule); empty: none
nightly_extra_jobs = ""
# the draft release's notes, as the release action's inputs (default: GitHub's, from the commits);
# a project can take them from a file release_name_step writes (body_path)
release_notes = "          generate_release_notes: true"
