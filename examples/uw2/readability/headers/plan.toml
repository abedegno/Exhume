# UW2's plan for tools/headergen.py: the shared headers of UW2Decomp commit 0c4d92c, generated from
# the sources before that commit (with a few hand fixes) by the script headergen.py was made from.
# Stems are the file names of that time (OVR112.C, SEG012.C ...); the files were renamed later.
# SEG003, SEG004 and SEG021 match the modules of those split segments by target (SEG003A.ASM ..).
# exclude is the result of the loop and the bisection (227 names whose files compile differently
# with one shared declaration, or that tie in order with such a name).

umbrella = "uw2.h"
umbrella_comment = "what every header includes: union Link, the link word that chains objects into lists. Each header declares the struct tags its declarations name and includes the headers that define them, so every tag a source sees is complete."
default_header = "sys.h"
allow_divergent = true
structs = "structs"
comment_drop = "Elsewhere|Later in this file|in other files|^/\\* This file|referenced before|called before|Defined later|options panel.s handlers"
