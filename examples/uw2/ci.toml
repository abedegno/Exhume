# UW2Decomp's values for tools/citemplates.py ([ci] vars in examples/uw2/exhume.toml): with
# them the templates give UW2Decomp's own workflows and actions, byte for byte
# (examples/uw2/prove-port.sh ci). UW2Decomp keeps its own copies of the setup scripts in
# tools/; the jobs that build check out Exhume into .exhume, at the commit UW2Decomp's
# tools/exhume-ref names, for the runtime its port and its gate compile where it is.

test = "make test"
test_full = "make test-full"
test_full_summary = "==== make test-full:"
setup_name = "make setup (Turbo C++ and TASM from the bundle's disk images)"
setup = "make setup"
setup_libs = "make setup-libs"
setup_sound = "make setup-sound"
port = "make port"
verify = "make verify"
verify_windows = "make PY=python verify"
setup_libs_windows = "UW2_LIBS=mt32emu make setup-libs"
port_check = "make port-check"
port_windows = "make PY=python port"
port_check_windows = "make PY=python port-check"
repocheck = "python3 tools/repocheck.py"
nightly_cron = "17 3 * * *"
exhume_checkout = '''
      # Exhume, whose runtime the port, the gate and the replay build compile where it is, at
      # the commit tools/exhume-ref names (docs/BUILDING.md, "Exhume")
      - name: Exhume's commit
        id: exhume
        shell: bash
        run: echo "ref=$(cut -d' ' -f1 tools/exhume-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: abedegno/Exhume
          ref: ${{ steps.exhume.outputs.ref }}
          path: .exhume
          persist-credentials: false'''
repocheck_env = ""
repocheck_exhume_checkout = ""
requirements = "tools/requirements.txt"
venv = ".venv"
node_cache_path = ""
npm_ci = "npm ci --no-audit --no-fund"
emu2_dir = "tools/emu2"
emu2_script = "tools/setup-emu2.sh"
emu2_patch = "tools/emu2-date.patch"
libs_dir = "tools/libs"
libs_script = "tools/setup-libs.sh"
libs_args = ""
nuked_dir = "tools/nuked-opl3"
sound_script = "tools/setup-sound.sh"
sound_args = ""
verify_dir = "build/replay/verify"
golden_dir = "tests/replay/golden"
coverage_doc = "docs/COVERAGE.md"
coverage_data = "build/coverage/all.profdata"
cleanup = "TC TASM build"
verify_cleanup = "build"
assets_action = "uw2-assets"
assets_title = "UW2 assets"
deploy_secret = "UW2_ASSETS_DEPLOY_KEY"
age_secret = "UW2_ASSETS_AGE_KEY"
age_env = "UW2_ASSETS_AGE_KEY"
bundle_repo = "abedegno/uw2-ci-assets"
bundle_file = "uw2-ci-assets.tar.gz.age"
