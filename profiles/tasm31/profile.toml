name = "Borland Turbo Assembler 3.1"
kind = "assembler"

[asm]
producer = "tasm"
command = "TASM {opts} {file}"
default_opts = "/ml"

[log]
problem = "(Error|Warning|Fatal)"
benign = "messages:\\s+None"
fatal = "(Error|Fatal)"

